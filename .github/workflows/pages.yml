# Veröffentlicht den Ordner public/ als Webseite (GitHub Pages, Quelle: „GitHub Actions“).
# Der Inhalt von public/ kommt aus dem App-Repo (Docs/) über Tools/webseite_veroeffentlichen.py, nicht von Hand ändern.
name: Webseite

on:
  push:
    branches: [main]
    paths: ["public/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
